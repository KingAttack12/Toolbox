<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠 Toolbox privée</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
<header class="topbar">
  <div class="brand">🛠 TOOLBOX <span class="sub">Tous tes outils au même endroit</span></div>
  <div class="top-actions">
    <button id="themeBtn" title="Mode sombre/clair">🌙</button>
    <button id="logoutBtn" class="hidden">Déconnexion</button>
  </div>
</header>

<!-- Login -->
<section id="loginView" class="login-wrap hidden">
  <form id="loginForm" class="card login-card">
    <h2>🔒 Accès privé</h2>
    <p class="muted">Connecte-toi pour utiliser ta toolbox.</p>
    <label>Utilisateur<input id="loginUser" autocomplete="username" value="admin"></label>
    <label>Mot de passe<input id="loginPass" type="password" autocomplete="current-password"></label>
    <button type="submit">Se connecter</button>
    <p id="loginError" class="error"></p>
  </form>
</section>

<!-- App -->
<main id="appView" class="hidden">
  <div class="searchbar">
    <input id="search" type="search" placeholder="🔍 Rechercher un outil... (ex : qr, tva, json, gc)">
  </div>

  <section class="cats">
    <button data-cat="all" class="cat active">⭐ Tout</button>
    <button data-cat="texte" class="cat">📝 Texte &amp; Code</button>
    <button data-cat="calc" class="cat">🧮 Calculatrices</button>
    <button data-cat="bio" class="cat">🧬 Bioinfo</button>
    <button data-cat="qr" class="cat">🔲 QR</button>
    <button data-cat="img" class="cat">🖼️ Images</button>
    <button data-cat="pdf" class="cat">📄 Documents</button>
    <button data-cat="media" class="cat">📥 Média</button>
    <button data-cat="anime" class="cat">🎌 Manga/Animé</button>
    <button data-cat="soon" class="cat">⏳ Bientôt</button>
  </section>

  <p id="recentLine" class="muted"></p>
  <div id="toolsGrid" class="grid"></div>
</main>

<!-- Panneau outil -->
<div id="toolModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="toolTitle"></h3>
      <button id="toolClose">✕</button>
    </div>
    <p id="toolDesc" class="muted"></p>
    <div id="toolFields"></div>
    <div class="row">
      <button id="toolRun" class="primary">Exécuter</button>
      <button id="toolFav">☆ Favori</button>
    </div>
    <div id="toolProgress" class="progress hidden"><div></div></div>
    <pre id="toolOutput" class="output" placeholder="Résultat..."></pre>
    <div id="toolResults" class="anime-results hidden"></div>
    <div id="toolDownloadWrap" class="hidden"><a id="toolDownload" download="resultat.png" class="btn">⬇ Télécharger le résultat</a></div>
    <p id="toolError" class="error"></p>
  </div>
</div>

<script src="/static/app.js?v=9"></script>

<footer class="footer">
  <a href="https://github.com/KingAttack12/Toolbox" target="_blank" rel="noopener">💻 Code source (GitHub)</a>
  <span>·</span>
  <a href="/static/about.html">À propos</a>
  <span>·</span>
  <a href="/static/privacy.html">Confidentialité</a>
  <span>·</span>
  <a href="/static/terms.html">Conditions d'utilisation</a>
  <span>·</span>
  <span class="muted">v9</span>
</footer>
</body>
</html>

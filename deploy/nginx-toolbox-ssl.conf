server {
    listen 80;
    server_name _;

    # Tout le trafic web passe en HTTPS (le HTTP est intercepté par
    # certains réseaux ; le HTTPS chiffré passe partout).
    return 301 https://$host$request_uri;
}

# HTTPS temporaire auto-signé (IP publique, pas de domaine) :
# remplace par Let's Encrypt (certbot) dès qu'un domaine pointe vers l'IP.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/toolbox-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/toolbox-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
